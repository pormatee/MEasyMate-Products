name: Deploy MEasyMate Apps

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build public site
        run: |
          rm -rf _site
          mkdir -p _site/money
          mkdir -p _site/projects/money
          mkdir -p _site/contact-shift
          mkdir -p _site/report-pro
          mkdir -p _site/projects/contact-shift
          mkdir -p _site/projects/report-pro
          mkdir -p _site/shared/analytics
          mkdir -p _site/shared/notify
          mkdir -p _site/shared/information
          mkdir -p _site/admin/analytics

          # Protected Admin (Cloudflare Access protects /admin/*)
          cp admin/index.html _site/admin/index.html
          cp admin/analytics/index.html _site/admin/analytics/index.html

          # Single source apps
          cp projects/money/index.html _site/money/index.html
          cp projects/contact-shift/index.html _site/contact-shift/index.html
          cp projects/report-pro/index.html _site/report-pro/index.html
          cp projects/report-pro/project-notice.js _site/report-pro/project-notice.js

          # Money project integration assets
          cp projects/money/analytics-config.js _site/money/analytics-config.js
          cp projects/money/information-config.js _site/money/information-config.js
          cp projects/money/project-notice.js _site/money/project-notice.js
          cp projects/money/system-test.js _site/money/system-test.js

          # Shared systems
          cp shared/information/measymate-information.js _site/shared/information/measymate-information.js
          cp shared/notify/all-project-notice.js _site/shared/notify/all-project-notice.js
          cp shared/notify/measymate-notify-core.js _site/shared/notify/measymate-notify-core.js
          cp shared/analytics/measymate-analytics.js _site/shared/analytics/measymate-analytics.js
          cp shared/analytics/measymate-usage-insights.js _site/shared/analytics/measymate-usage-insights.js

          # Old Contact Shift URL -> clean URL
          cat > _site/projects/contact-shift/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=/contact-shift/">
          <script>location.replace('/contact-shift/')</script>
          HTML

          # PWA / shortcut assets
          cp shared/brand/measymate-icon-192.png _site/money/icon-192.png
          cp shared/brand/measymate-icon-192.png _site/money/icon-180.png
          cp shared/brand/measymate-icon-512.png _site/money/icon-512.png

          cat > _site/money/manifest.webmanifest <<'JSON'
          {
            "name": "MEasyMate Money",
            "short_name": "Money",
            "description": "วางแผนเงิน สร้างอนาคต แบบง่ายๆ",
            "start_url": "/money/",
            "scope": "/money/",
            "display": "standalone",
            "background_color": "#f5fbff",
            "theme_color": "#1689f5",
            "icons": [
              {"src":"./icon-192.png","sizes":"192x192","type":"image/png","purpose":"any"},
              {"src":"./icon-512.png","sizes":"512x512","type":"image/png","purpose":"any"}
            ]
          }
          JSON

          cat > _site/money/sw.js <<'JS'
          const CACHE='measymate-money-runtime-v3';
          self.addEventListener('install',()=>self.skipWaiting());
          self.addEventListener('activate',e=>e.waitUntil((async()=>{
            const ks=await caches.keys();
            await Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)));
            await self.clients.claim();
          })()));
          self.addEventListener('fetch',e=>{
            if(e.request.method!=='GET')return;
            e.respondWith(fetch(e.request).then(r=>{
              const c=r.clone(); caches.open(CACHE).then(x=>x.put(e.request,c)).catch(()=>{});
              return r;
            }).catch(()=>caches.match(e.request)));
          });
          JS

          # Old Money URL -> clean URL
          cat > _site/projects/money/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=/money/">
          <script>location.replace('/money/')</script>
          HTML

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
