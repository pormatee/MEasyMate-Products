const BASE={goal:'daily',xp:0,today:0,missionDone:[],fav:[],srs:{},skills:{mission:{ok:0,total:0},pron:{ok:0,total:0},vocab:{ok:0,total:0},grammar:{ok:0,total:0}},accent:'en-US'};
function clone(){return JSON.parse(JSON.stringify(BASE))}
function load(){
  try{
    const current=localStorage.getItem(KEY);
    if(current) return {...clone(),...JSON.parse(current||'{}')};
    for(const k of LEGACY_KEYS){
      const legacy=localStorage.getItem(k);
      if(legacy){
        const migrated={...clone(),...JSON.parse(legacy||'{}')};
        localStorage.setItem(KEY, JSON.stringify(migrated));
        return migrated;
      }
    }
    return clone();
  }catch{return clone()}
}
let state=load(),page='today',mode=null,missionId=null,missionStep=0,missionResult=null,cat='greet',wordIdx=0,reveal=false,pronIdx=0,grammarIdx=0;
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function goalIcon(g){return g==='work'?'🏭':g==='travel'?'🧳':'☕'}
function goalLabel(g){return g==='work'?'ทำงาน':g==='travel'?'ท่องเที่ยว':'ชีวิตประจำวัน'}
function currentMission(){const a=MISSIONS.filter(x=>x.goal===state.goal);return a.find(x=>!state.missionDone.includes(x.id))||a[0]}
function localDate(){return new Date().toISOString().slice(0,10)}
function speak(t,rate=.82){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=state.accent||'en-US';u.rate=rate;speechSynthesis.speak(u)}catch{}}
function toggleAccent(){state.accent=state.accent==='en-GB'?'en-US':'en-GB';localStorage.setItem(KEY,JSON.stringify(state));render()}
function setGoal(g){state.goal=g;missionId=null;missionStep=0;missionResult=null;save()}
function go(p){page=p;mode=null;document.body.classList.remove('focus');scrollTo({top:0});render()}
function openPractice(m){mode=m;page='practice';document.body.classList.add('focus');scrollTo({top:0});render()}
function startMission(id=null){missionId=id||currentMission()?.id;missionStep=0;missionResult=null;openPractice('mission')}
function focusHead(t,s,b='practice'){return `<div class="focusHead"><button class="focusBack" onclick="${b==='today'?"go('today')":"closePractice()"}">‹</button><div><h2>${t}</h2><p>${s}</p></div></div>`}
function closePractice(){mode=null;document.body.classList.remove('focus');render()}
function task(ic,t,d,act,b='›'){return `<button class="task" onclick="${act}"><span class="taskIcon">${ic}</span><span><b>${t}</b><div class="desc">${d}</div></span><span class="chev">${b}</span></button>`}
function skill(id,ic,t,d,score=null){return `<button class="card skill" onclick="openPractice('${id}')"><span class="icon">${ic}</span>${score!==null?`<span class="skillScore">${score}%</span>`:''}<h3>${t}</h3><p>${d}</p></button>`}
function pct(k){const x=state.skills[k];return x&&x.total?Math.round(x.ok/x.total*100):0}
function srs(id){return state.srs[id]||(state.srs[id]={reps:0,lapses:0,due:0})}
function dueWords(){return VOCAB.filter(w=>{const x=state.srs[w.id];return x&&x.due<=Date.now()})}
function learned(){return Object.keys(state.srs).length}
function mastered(){return Object.values(state.srs).filter(x=>x.reps>=3&&x.lapses<2).length}

function missionPractice(){
 const m=MISSIONS.find(x=>x.id===missionId)||currentMission(); if(!m)return '';
 const step=Math.max(0,Math.min(3,missionStep)),pctv=(step+1)*25,dots=[0,1,2,3].map(i=>`<span class="stepDot ${i===step?'on':''}"></span>`).join('');
 let body='';
 if(step===0)body=`<div class="missionStepTitle">STEP 1 • ประโยคที่คุณจะใช้</div><div class="missionCore"><div class="en">${m.phrase}</div><div class="th">${m.th}</div><button class="btn primary full" style="margin-top:8px" onclick="speak(${JSON.stringify(m.phrase)},.78)">🔊 ฟัง แล้วพูดตาม 3 รอบ</button></div>`;
 if(step===1)body=`<div class="missionStepTitle">STEP 2 • แยกประโยคให้จำง่าย</div><div class="stepChunkList">${m.chunks.map(c=>`<div class="stepChunk"><b>${c[0]}</b><span>${c[1]}</span></div>`).join('')}</div><div class="stepTrap">🇹🇭 <b>Thai Trap:</b> ${m.trap}</div>`;
 if(step===2){
   const good=m.opts.find(o=>o[2]==='1');
   body=`<div class="missionStepTitle">STEP 3 • คุยโต้ตอบ</div><div class="convHow"><div><b>① 🔊</b><span>ฟังอีกฝ่าย</span></div><div><b>② 🙋</b><span>ถึงตาคุณ</span></div><div><b>③ ✅</b><span>ตอบให้เหมาะ</span></div></div><div class="chatArea">
   <div class="chatBubble other"><div class="chatWho">🌍 อีกฝ่ายพูด</div><div class="chatEN">${m.partner}</div><div class="chatTH">${m.partnerTh}</div><button class="btn soft" style="margin-top:6px;min-height:36px" onclick="speak(${JSON.stringify(m.partner)},.8)">🔊 ฟังอีกฝ่าย</button></div>
   <div class="yourTurn">ถึงตาคุณแล้ว — จะตอบว่าอะไร?</div><div class="roleOpts">${m.opts.map(o=>`<button class="convAnswer ${missionResult&&o[2]==='1'?'correct':''}" onclick="markMissionOption(${o[2]==='1'})"><b>${o[0]}</b><span>${o[1]}</span></button>`).join('')}</div>
   ${missionResult==='correct'?`<div class="chatBubble me"><div class="chatWho">🙋 คุณตอบ</div><div class="chatEN">${good[0]}</div><div class="chatTH">${good[1]}</div><button class="btn soft" style="margin-top:6px;min-height:36px" onclick="speak(${JSON.stringify(good[0])},.8)">🔊 ฟังคำตอบ</button></div><div class="feedback ok">✓ สนทนารอบนี้ผ่านแล้ว</div>`:missionResult==='wrong'?`<div class="feedback no">ยังไม่เหมาะกับสถานการณ์นี้ ลองใหม่ได้เลย</div>`:''}</div>`;
 }
 if(step===3)body=`<div class="missionStepTitle">STEP 4 • ประโยคสำรอง + จบ Mission</div><div class="finishCard"><div class="big">✅</div><div class="title">Mission นี้พร้อมใช้</div><div class="small muted">${m.title}</div><div class="rescue"><div class="tiny muted">🆘 Rescue Phrase</div><div class="en">${m.rescue}</div><div class="small">${m.rescueTh}</div><button class="btn soft" style="margin-top:6px" onclick="speak(${JSON.stringify(m.rescue)},.78)">🔊 ฟัง</button></div></div>`;
 const next=step===0?'แยกประโยค →':step===1?'เริ่มคุยโต้ตอบ →':step===2?(missionResult==='correct'?'จบ Mission →':'เลือกคำตอบก่อน'):'Mission ถัดไป →';
 return `<div class="missionShell">${focusHead('Mission ใช้จริง',`${goalIcon(m.goal)} ${goalLabel(m.goal)} • ${m.title}`,'today')}<div class="missionProgress"><b>${step+1}/4</b><div class="bar"><i style="width:${pctv}%"></i></div></div><div class="stepDots">${dots}</div><section class="missionStepCard">${body}</section><div class="missionStepNav"><button class="btn soft" onclick="missionPrev()">${step===0?'กลับวันนี้':'‹ ก่อนหน้า'}</button><button class="btn next" onclick="missionNext()" ${step===2&&missionResult!=='correct'?'disabled':''}>${next}</button></div></div>`;
}
function missionPrev(){if(missionStep>0){missionStep--;render();scrollTo({top:0})}else go('today')}
function missionNext(){if(missionStep===2&&missionResult!=='correct')return;if(missionStep<3){missionStep++;render();scrollTo({top:0})}else nextMission()}
function markMissionOption(ok){state.skills.mission.total++;if(ok){state.skills.mission.ok++;if(!state.missionDone.includes(missionId))state.missionDone.push(missionId);state.xp+=10;missionResult='correct'}else{state.xp+=1;missionResult='wrong'}localStorage.setItem(KEY,JSON.stringify(state));render()}
function nextMission(){const a=MISSIONS.filter(x=>x.goal===state.goal),i=a.findIndex(x=>x.id===missionId);missionId=a[(i+1)%a.length].id;missionStep=0;missionResult=null;render();scrollTo({top:0})}

function pronPractice(){
 const x=PRON[pronIdx%PRON.length];
 return `<div class="studyShell">${focusHead('ออกเสียงสำหรับคนไทย',`${pronIdx+1}/${PRON.length} • ฟัง → สังเกตปาก → เลียนแบบ`)}<section class="card pronCard"><div class="badge">${x.title}</div><div class="pronWords"><button class="pronWord" onclick="speak(${JSON.stringify(x.a)},.68)"><b>${x.a}</b><div class="tiny muted">แตะเพื่อฟัง</div></button><button class="pronWord" onclick="speak(${JSON.stringify(x.b)},.68)"><b>${x.b}</b><div class="tiny muted">แตะเพื่อเทียบ</div></button></div><div class="pronTip">👄 ${x.thai}</div><div class="trapBox">🇹🇭 <b>Thai Trap:</b> ${x.trap}</div><div class="row" style="margin-top:9px"><button class="btn soft" onclick="pronIdx=(pronIdx-1+PRON.length)%PRON.length;render()">‹ ก่อนหน้า</button><button class="btn good" style="flex:1" onclick="state.skills.pron.total++;state.skills.pron.ok++;pronIdx=(pronIdx+1)%PRON.length;save()">เข้าใจแล้ว →</button></div></section></div>`;
}
function grammarPractice(){
 const g=GRAMMAR[grammarIdx%GRAMMAR.length];
 return `<div class="studyShell">${focusHead('ไวยากรณ์แบบไทย',`${grammarIdx+1}/${GRAMMAR.length} • เข้าใจ Pattern ก่อนชื่อ Grammar`)}<section class="card pad"><div class="title">${g.t}</div><div class="grammarBox" style="margin-top:9px"><div class="tiny muted">Pattern</div><div class="formula">${g.f}</div><div class="example">${g.ex}</div><div class="small" style="margin-top:4px">${g.th}</div><div class="trapBox">💡 ${g.tip}</div><button class="btn soft full" style="margin-top:8px" onclick="speak(${JSON.stringify(g.ex)},.78)">🔊 ฟังตัวอย่าง</button></div><div class="row" style="margin-top:9px"><button class="btn soft" onclick="grammarIdx=(grammarIdx-1+GRAMMAR.length)%GRAMMAR.length;render()">‹</button><button class="btn good" style="flex:1" onclick="state.skills.grammar.total++;state.skills.grammar.ok++;grammarIdx=(grammarIdx+1)%GRAMMAR.length;save()">เข้าใจแล้ว →</button></div></section></div>`;
}
function listenPractice(){
 const w=VOCAB[Math.floor(Math.random()*VOCAB.length)];
 return `<div class="studyShell">${focusHead('ฝึกฟังคำศัพท์','ฟังก่อน แล้วค่อยเปิดคำตอบ')}<section class="card wordCard"><button class="btn primary" onclick="speak(${JSON.stringify(w.en)},.72)">🔊 ฟังคำ</button><div style="margin-top:13px"><div class="wordTH">${w.thai}</div><div class="tiny muted">ลองนึกคำอังกฤษก่อน</div></div><button class="btn soft full" style="margin-top:10px" onclick="alert(${JSON.stringify(w.en)})">ดูคำตอบ</button><button class="btn good full" style="margin-top:7px" onclick="state.skills.vocab.total++;state.skills.vocab.ok++;render()">คำถัดไป →</button></section></div>`;
}
function filtered(){return VOCAB.filter(w=>w.cat===cat)}
function learn(){
 const a=filtered(),w=a[wordIdx%a.length];
 return `<div class="studyShell">${focusHead('คำศัพท์','ฟัง → นึกความหมาย → ทบทวน','today')}<div class="chips">${CATS.map(c=>`<button class="chip ${cat===c[0]?'on':''}" onclick="cat='${c[0]}';wordIdx=0;reveal=false;render()">${c[1]} ${c[2]}</button>`).join('')}</div><section class="card wordCard" style="margin-top:8px"><span class="badge">${CATS.find(c=>c[0]===w.cat)?.[2]||''}</span><div class="wordEN">${w.en}</div><div class="listenRow"><button onclick="speak(${JSON.stringify(w.en)},.62)">🐢</button><button onclick="speak(${JSON.stringify(w.en)},.88)">🔊</button></div>${reveal?`<div class="wordTH">${w.thai}</div><div class="row" style="margin-top:9px"><button class="btn soft" style="flex:1" onclick="rate(${w.id},1)">↻ ยังไม่แม่น</button><button class="btn good" style="flex:1" onclick="rate(${w.id},4)">✓ จำได้</button></div>`:`<button class="btn primary full" style="margin-top:10px" onclick="reveal=true;render()">ดูความหมาย</button>`}</section></div>`;
}
function rate(id,q){const x=srs(id);x.reps++;if(q<=1)x.lapses++;x.due=Date.now()+(q>=4?Math.min(30,2**Math.min(5,x.reps-1))*86400000:0);state.xp+=q>=4?5:1;wordIdx=(wordIdx+1)%filtered().length;reveal=false;save()}
function review(){
 const a=dueWords();if(!a.length)return `<div class="studyShell">${focusHead('ทบทวน','SRS เลือกคำที่ถึงเวลา','today')}<section class="card pad"><div class="title">✓ วันนี้ทบทวนครบแล้ว</div></section></div>`;
 const w=a[0];return `<div class="studyShell">${focusHead('ทบทวน',`เหลือ ${a.length} คำ`,'today')}<section class="card wordCard"><div class="wordTH">${w.thai}</div>${reveal?`<div class="wordEN">${w.en}</div><button class="btn soft" onclick="speak(${JSON.stringify(w.en)},.72)">🔊 ฟัง</button><div class="row" style="margin-top:9px"><button class="btn soft" style="flex:1" onclick="reviewRate(${w.id},1)">ลืม</button><button class="btn good" style="flex:1" onclick="reviewRate(${w.id},4)">จำได้</button></div>`:`<button class="btn primary full" style="margin-top:10px" onclick="reveal=true;render()">เปิดคำตอบ</button>`}</section></div>`;
}
function reviewRate(id,q){const x=srs(id);if(q<=1){x.lapses++;x.due=Date.now()}else{x.reps++;x.due=Date.now()+Math.min(30,2**Math.max(0,x.reps-1))*86400000}reveal=false;save()}
function backupPractice(){return `<div class="studyShell">${focusHead('ข้อมูลของฉัน','เก็บความคืบหน้าไว้กับตัวคุณ')}<section class="card pad"><div class="title">Backup / Restore</div><p class="subtitle">ข้อมูลเรียนเก็บใน Browser เครื่องนี้ ควรสำรองเป็นระยะ</p><div class="row" style="margin-top:9px"><button class="btn primary" style="flex:1" onclick="backup()">⬇ Backup</button><label class="btn soft" style="flex:1;cursor:pointer">⬆ Restore<input type="file" accept="application/json" style="display:none" onchange="restoreFile(this.files[0])"></label></div></section></div>`}
function backup(){const blob=new Blob([JSON.stringify({schemaVersion:1,product:'talknow',edition:'V1 FREE',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`talknow-v1-free-backup-${localDate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreFile(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.state)throw 0;state={...clone(),...x.state};localStorage.setItem(KEY,JSON.stringify(state));alert('Restore สำเร็จ');render()}catch{alert('ไฟล์ Backup ไม่ถูกต้อง')}};r.readAsText(f)}
function progress(){
 return `<div class="stack"><section class="card pad"><div class="title">พัฒนาการ</div><div class="metrics" style="margin-top:9px"><div class="metric"><b>${learned()}</b><span>คำที่เรียน</span></div><div class="metric"><b>${mastered()}</b><span>จำมั่นคง</span></div><div class="metric"><b>${state.xp}</b><span>XP</span></div></div></section><section class="card pad"><b>ทักษะ</b><div class="small" style="margin-top:8px">คุยโต้ตอบ ${pct('mission')}%</div><div class="progress"><i style="width:${pct('mission')}%"></i></div><div class="small" style="margin-top:8px">ออกเสียง ${pct('pron')}%</div><div class="progress"><i style="width:${pct('pron')}%"></i></div><div class="small" style="margin-top:8px">คำศัพท์ ${pct('vocab')}%</div><div class="progress"><i style="width:${pct('vocab')}%"></i></div></section></div>`;
}
function renderNav(){
 const n=[['today','🏠','วันนี้'],['learn','🧠','คำศัพท์'],['review','🔁','ทบทวน'],['practice','🎯','ฝึก'],['progress','📊','พัฒนา']];
 document.getElementById('nav').innerHTML=n.map(x=>`<button class="navBtn ${page===x[0]?'on':''}" onclick="go('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('');
 document.getElementById('nav').classList.toggle('hiddenFocus',!!mode);
}
function render(){
 const app=document.getElementById('app');document.getElementById('accentBtn').textContent=state.accent==='en-GB'?'🇬🇧':'🇺🇸';
 if(page==='today')app.innerHTML=today();else if(page==='learn')app.innerHTML=learn();else if(page==='review')app.innerHTML=review();else if(page==='practice')app.innerHTML=practice();else app.innerHTML=progress();renderNav();
}
render();

if(location.protocol==='http:'||location.protocol==='https:'){
  const a=document.createElement('script');
  a.src='../../shared/notify/all-project-notice.js';
  a.onload=()=>{
    const b=document.createElement('script');
    b.src='./project-notice.js';
    b.onload=()=>{
      const c=document.createElement('script');
      c.src='../../shared/notify/measymate-notify-core.js';
      document.head.appendChild(c);
    };
    document.head.appendChild(b);
  };
  document.head.appendChild(a);
}

</script>
