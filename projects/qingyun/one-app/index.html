let ttsSeq=0,ttsUtterance=null,ttsLastTap=0,ttsSpeaking=false;
function stopSpeech(){
  ttsSeq++;
  ttsSpeaking=false;
  ttsUtterance=null;
  try{speechSynthesis.cancel()}catch{}
}
function speak(text,rate=.82){
  if(!('speechSynthesis'in window)){toast('เครื่องนี้ยังไม่มีเสียงอ่าน');return}
  const now=Date.now();
  if(now-ttsLastTap<450)return;
  ttsLastTap=now;

  if(ttsSpeaking){
    stopSpeech();
    toast('หยุดเสียงแล้ว');
    return;
  }

  const clean=String(text||'').replace(/_+/g,' ').replace(/\s+/g,' ').trim();
  if(!clean)return;

  const seq=++ttsSeq;
  ttsSpeaking=true;
  try{speechSynthesis.cancel()}catch{}

  setTimeout(()=>{
    if(seq!==ttsSeq)return;
    const u=new SpeechSynthesisUtterance(clean);
    ttsUtterance=u;
    u.lang='zh-CN';
    u.rate=rate;
    const vs=speechSynthesis.getVoices();
    u.voice=vs.find(v=>/^(zh|cmn)/i.test(v.lang))||vs.find(v=>/zh|cmn/i.test(v.lang))||null;

    const done=()=>{
      if(seq!==ttsSeq)return;
      ttsSpeaking=false;
      ttsUtterance=null;
    };
    u.onend=done;
    u.onerror=done;

    try{speechSynthesis.speak(u)}
    catch(e){done();toast('เปิดเสียงไม่สำเร็จ')}
  },120);
}

k="speak('${safeJs(ex[0][0])}',.8)">🔊</button></div><div class="examplePy">${ex[0][1]}</div><div class="exampleTh">${ex[0][2]}</div></div><div><div class="studyActions"><button class="btn softbtn" onclick="rateSrs(VOCAB[${w.id-1}],1,'learn')">↻ ยังไม่แม่น</button><button class="btn good" onclick="rateSrs(VOCAB[${w.id-1}],4,'learn')">✓ จำได้</button></div><div class="studyHint">ตอบแล้วระบบเลื่อนไปคำถัดไปอัตโนมัติ</div></div>`:`<div><button class="btn primary full" onclick="revealed=true;renderAll()">ดูความหมาย</button><div class="nextRow"><button class="btn softbtn" onclick="prevLearn()">‹</button><button class="btn ghost" onclick="nextLearn()">ข้ามไปคำถัดไป →</button><button class="btn softbtn" onclick="nextLearn()">›</button></div><div class="studyHint">ปัดซ้าย = คำถัดไป • ปัดขวา = คำก่อนหน้า</div></div>`}</section></div>`}

ck="rateSrs(VOCAB[${w.id-1}],3,'review')">ยาก</button><button class="btn good" onclick="rateSrs(VOCAB[${w.id-1}],4,'review')">จำได้</button></div>`:`<button class="btn primary full" onclick="revealed=true;renderAll()">เปิดคำตอบ</button>`}</section></div>`}

function practiceDetail(){if(practiceMode==='reading')return pinyinPractice();if(practiceMode==='hanzi')return hanziMemoryPractice();if(practiceMode==='tone')return tonePractice();if(practiceMode==='dictation')return dictationPractice();if(practiceMode==='shadowing')return shadowPractice();if(practiceMode==='write')return writePracticeV3();if(practiceMode==='grammar')return grammarPractice();return ''}

function pinyinDataset(){
  if(pinyinMode==='initial')return PINYIN_INITIALS;
  if(pinyinMode==='final')return PINYIN_FINALS;
  if(pinyinMode==='tone')return PINYIN_TONES;
  return PINYIN_BLENDS;
}
function setPinyinMode(m){pinyinMode=m;pinyinIndex=0;readingResult=null;renderAll()}
function nextPinyin(){const a=pinyinDataset();pinyinIndex=(pinyinIndex+1)%a.length;readingResult=null;renderAll();scrollTo({top:0,behavior:'smooth'})}
function prevPinyin(){const a=pinyinDataset();pinyinIndex=(pinyinIndex-1+a.length)%a.length;readingResult=null;renderAll();scrollTo({top:0,behavior:'smooth'})}
function pinyinPractice(){
  const modes=[['initial','พยัญชนะ'],['final','สระ'],['blend','ผสม'],['tone','โทน']];
  const a=pinyinDataset(),x=a[pinyinIndex%a.length],pct=Math.round((pinyinIndex+1)/a.length*100);
  let core='';
  if(pinyinMode==='blend'){
    core=`<div class="simpleSound">
      <div class="tiny muted" style="text-align:center;font-weight:900">อ่านทีละส่วน</div>
      <div class="simpleEquation">
        <div class="eqPart">${x.initial}</div><div class="eqPlus">+</div>
        <div class="eqPart">${x.final}</div><div class="eqPlus">+</div>
        <div class="eqPart">เสียง ${x.tone}</div>
      </div>
      <div class="focusResult">
        <div class="tiny muted">รวมเป็น</div>

        <div class="zh">${x.zh}</div>

  }else if(pinyinMode==='initial'||pinyinMode==='final'){
    core=`<div class="simpleSound">
      <div class="focusResult">
        <div class="soundLatin">${x.py}</div>
        <div class="soundThai">ใกล้เสียงไทย: ${x.thai}</div>

      <div class="mouthCue" style="text-align:center">${x.cue}</div>
      <div class="soundExample" style="text-align:center">
        <div class="zh" style="font-size:31px;font-weight:950">${x.ex}</div>
        <div class="pinyin">${x.exPy}</div>
        ${x.exTh?`<div class="small">${x.exTh}</div>`:''}
      </div>
      <button class="btn primary listenPrimary" onclick="speak('${safeJs(x.ex)}',.62)">🔊 ฟังเสียงจีนจริง</button>
    </div>`;
  }else{
    core=`<div class="simpleSound">
      <div class="focusResult">
        <div class="tiny muted">Tone ${x.n}</div>

      ${core}

      </div>
    </section>
  </div>`
}

function strokeSvg(pack){
  const current=Math.min(strokeStepIndex,pack.strokes.length-1);
  const complete=current===pack.strokes.length-1;
  const lines=pack.strokes.map((s,i)=>{
    const shown=i<=current;
    const active=i===current;
    const stroke=shown?(active?'#dc2626':'#b91c1c'):'#d4d4d8';
    const width=shown?(active?9:8):2;
    const opacity=shown?1:.16;
    return `<g opacity="${opacity}">
      <path d="${s.d}" fill="none" stroke="${stroke}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" ${active?'marker-end="url(#arrowNow)"':''}></path>
      ${shown?`<circle cx="${s.start[0]}" cy="${s.start[1]}" r="${active?8:6.5}" fill="${active?'#dc2626':'#b91c1c'}"></circle><text x="${s.start[0]}" y="${s.start[1]+3}" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="900">${i+1}</text>`:''}
    </g>`;
  }).join('');
  return `<svg viewBox="0 0 120 120" aria-label="ลำดับขีด ${pack.char}">
    <defs><marker id="arrowNow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"></path></marker></defs>
    <path d="M60 0 V120 M0 60 H120 M0 0 L120 120 M120 0 L0 120" stroke="var(--line)" stroke-width=".65" stroke-dasharray="3 3" fill="none"></path>
    ${lines}
    ${complete?`<text x="60" y="114" text-anchor="middle" font-size="7" fill="var(--good)" font-weight="900">ครบทุกขีด ✓</text>`:''}
  </svg>`
}

  const pack=STROKE_PACK[writeCharIndex%STROKE_PACK.length];

function initCanvas(){
  const c=document.getElementById('writeCanvas');
  if(!c)return;
  const rect=c.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);
  const cssW=Math.max(1,rect.width),cssH=Math.max(1,rect.height);
  c.width=Math.max(1,Math.round(cssW*dpr));
  c.height=Math.max(1,Math.round(cssH*dpr));
  const ctx=c.getContext('2d');
  if(!ctx)return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineWidth=8;
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.strokeStyle='#dc2626';

  const key=writingInkKey();
  if(!Array.isArray(writingInk[key]))writingInk[key]=[];

  const drawPath=(path)=>{
    if(!path||!path.length)return;
    ctx.beginPath();
    const first=path[0];
    ctx.moveTo(first.x*cssW,first.y*cssH);
    if(path.length===1){
      ctx.lineTo(first.x*cssW+.01,first.y*cssH+.01);
    }else{
      for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x*cssW,path[i].y*cssH);
    }
    ctx.stroke();
    ctx.closePath();
  };

  // วาดเส้นเดิมกลับทุกครั้งที่หน้า render ใหม่ (เช่น กดขีดถัดไป)
  writingInk[key].forEach(drawPath);

  let drawing=false,currentPath=null,lastPx=null;
  const point=(clientX,clientY)=>{
    const r=c.getBoundingClientRect();
    const px=Math.max(0,Math.min(r.width,clientX-r.left));
    const py=Math.max(0,Math.min(r.height,clientY-r.top));
    return {px,py,x:px/Math.max(1,r.width),y:py/Math.max(1,r.height)};
  };
  const begin=(clientX,clientY)=>{
    const p=point(clientX,clientY);
    drawing=true;
    currentPath=[{x:p.x,y:p.y}];
    writingInk[key].push(currentPath);
    lastPx={x:p.px,y:p.py};
    ctx.beginPath();
    ctx.moveTo(p.px,p.py);
    ctx.lineTo(p.px+.01,p.py+.01);
    ctx.stroke();
  };
  const move=(clientX,clientY)=>{
    if(!drawing||!currentPath)return;
    const p=point(clientX,clientY);
    // ลดจำนวนจุดที่เก็บ โดยไม่ทำให้เส้นดูสะดุด
    if(lastPx && Math.hypot(p.px-lastPx.x,p.py-lastPx.y)<1.6)return;
    currentPath.push({x:p.x,y:p.y});
    ctx.lineTo(p.px,p.py);
    ctx.stroke();
    lastPx={x:p.px,y:p.py};
    // ป้องกันการเก็บข้อมูลมากเกินไปใน session
    if(currentPath.length>2500)currentPath.splice(1,1);
  };
  const end=()=>{
    if(!drawing)return;
    drawing=false;
    currentPath=null;
    lastPx=null;
    ctx.closePath();
  };

  c.addEventListener('touchstart',e=>{
    if(!e.touches.length)return;
    e.preventDefault();
    const t=e.touches[0];
    begin(t.clientX,t.clientY);
  },{passive:false});
  c.addEventListener('touchmove',e=>{
    if(!e.touches.length)return;
    e.preventDefault();
    const t=e.touches[0];
    move(t.clientX,t.clientY);
  },{passive:false});
  c.addEventListener('touchend',e=>{e.preventDefault();end()},{passive:false});
  c.addEventListener('touchcancel',e=>{e.preventDefault();end()},{passive:false});

  c.addEventListener('mousedown',e=>{e.preventDefault();begin(e.clientX,e.clientY)});
  window.addEventListener('mousemove',e=>{if(drawing)move(e.clientX,e.clientY)});
  window.addEventListener('mouseup',end);

  if(window.PointerEvent){
    c.addEventListener('pointerdown',e=>{
      if(e.pointerType!=='pen')return;
      e.preventDefault();
      begin(e.clientX,e.clientY);
    });
    c.addEventListener('pointermove',e=>{
      if(e.pointerType!=='pen')return;
      e.preventDefault();
      move(e.clientX,e.clientY);
    });
    c.addEventListener('pointerup',e=>{
      if(e.pointerType==='pen'){e.preventDefault();end()}
    });
    c.addEventListener('pointercancel',e=>{
      if(e.pointerType==='pen'){e.preventDefault();end()}
    });
  }
}
function clearCanvas(){
  const key=writingInkKey();
  writingInk[key]=[];
  const c=document.getElementById('writeCanvas');
  if(!c)return;
  const ctx=c.getContext('2d');
  if(!ctx)return;
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,c.width,c.height);
  ctx.restore();
}

function exportBackup(){const blob=new Blob([JSON.stringify({schemaVersion:2,product:'qingyun',edition:'QingYun',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`qingyun-backup-${localDate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),raw=d.state||d;state={...DEFAULT,...raw,srs:raw.srs||{},favorites:raw.favorites||[],history:raw.history||{},missions:raw.missions||{},skillStats:{...DEFAULT.skillStats,...(raw.skillStats||{})}};save();toast('นำเข้าความคืบหน้าสำเร็จ')}catch{toast('ไฟล์ Backup ไม่ถูกต้อง')}};r.readAsText(file)}
function resetProgress(){if(confirm('ล้าง XP, SRS และสถิติทั้งหมดหรือไม่?')){const theme=state.theme;state=cloneDefault();state.theme=theme;save();toast('รีเซ็ตแล้ว')}}
function go(t){stopSpeech();tab=t;if(t!=='mission')activeMissionId=null;practiceMode=null;revealed=false;reviewQueue=null;reviewLabel='ถึงกำหนด';renderAll();scrollTo({top:0,behavior:'smooth'})}
function goPractice(m){tab='practice';practiceMode=null;openPractice(m)}
function installSwipe(){const card=document.querySelector('[data-swipe="learn"]');if(!card)return;card.onpointerdown=e=>{if(e.target.closest('button,input'))return;swipeStart={x:e.clientX,y:e.clientY}};card.onpointerup=e=>{if(!swipeStart)return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.25){dx<0?nextLearn():prevLearn()}}}
function renderAll(){normalizeDay();renderNav();topStats();applyTheme();const v=document.getElementById('view');v.innerHTML=({today,mission,learn,review,practice,progress}[tab]||today)();if(tab==='learn')installSwipe();if(tab==='practice'&&practiceMode==='write')requestAnimationFrame(initCanvas)}
window.addEventListener('pagehide',stopSpeech);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeech()});
document.getElementById('themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';save()};
Object.assign(window,{go,goPractice,setCat,nextLearn,prevLearn,toggleFav,rateSrs,speak,toggleSearch,startWeakReview,openPractice,closePractice,setPinyinMode,nextPinyin,prevPinyin,markPinyinPractice,nextHanziMemory,prevHanziMemory,openWriteChar,selectWriteChar,nextStrokeStep,prevStrokeStep,prevWriteChar,nextWriteChar,answerTone,checkDict,startShadow,nextPhrase,clearCanvas,nextWrite,startGrammarQuiz,answerGrammar,nextGrammar,prevGrammar,exportBackup,importBackup,resetProgress,openMission,closeMission,missionPrev,missionNext,answerMission,completeMission,nextMissionId,setMissionGoal});
normalizeDay();renderAll();

});
