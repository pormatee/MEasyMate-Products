const KEY='hanasu_v1_free';
const LEGACY_KEYS=['hanasu_jp_v1_free','hikari_jp_v1_free'];
function readSavedState(){
  let raw=localStorage.getItem(KEY);
  if(raw)return raw;
  for(const k of LEGACY_KEYS){
    const legacy=localStorage.getItem(k);
    if(legacy){
      try{localStorage.setItem(KEY,legacy)}catch{}
      return legacy;
    }
  }
  return '{}';
}
const DEF={xp:0,streak:0,today:0,daily:5,srs:{},fav:[],goal:'daily',missionDone:[],skills:{kana:{ok:0,total:0},vocab:{ok:0,total:0},grammar:{ok:0,total:0},mission:{ok:0,total:0}},dark:false,lastDate:''};
const clone=()=>JSON.parse(JSON.stringify(DEF));
function load(){try{return {...clone(),...JSON.parse(readSavedState())}}catch{return clone()}}
let state=load(),tab='today',mode=null,cat='all',idx=0,reveal=false,kanaMode='hira',kanaIndex=0,kanjiIndex=0,writeIndex=0,strokeIndex=0,grammarIndex=0,grammarQuiz=false,grammarResult=null,missionId=null,missionResult=null,missionStep=0,missionReading=false;
let writingInk={};
const NAV=[['today','🏠','วันนี้'],['learn','🧠','เรียน'],['review','🔁','ทบทวน'],['practice','🎯','ฝึก'],['progress','📊','พัฒนา']];

function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function localDate(){return new Date().toISOString().slice(0,10)}
function touchDay(){const d=localDate();if(state.lastDate!==d){state.today=0;state.lastDate=d}}
touchDay();
function speak(t,rate=.78){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=rate;speechSynthesis.speak(u)}catch{}}
function toggleDark(){state.dark=!state.dark;save()}
function pctSkill(k){const x=state.skills[k]||{ok:0,total:0};return x.total?Math.round(x.ok/x.total*100):0}
function srs(id){if(!state.srs[id])state.srs[id]={reps:0,due:0,lapses:0};return state.srs[id]}
function dueWords(){const n=Date.now();return VOCAB.filter(w=>srs(w.id).reps>0&&srs(w.id).due<=n)}
function learned(){return VOCAB.filter(w=>srs(w.id).reps>0).length}
function mastered(){return VOCAB.filter(w=>srs(w.id).reps>=4).length}
function go(t){tab=t;mode=null;reveal=false;render();scrollTo({top:0})}
function openPractice(m){tab='practice';mode=m;render();scrollTo({top:0})}
function closePractice(){mode=null;render()}
function focusHead(t,s,d='practice'){return `<div class="focusHead"><button class="focusBack" onclick="go('${d}')">‹</button><div><h2>${t}</h2><p>${s}</p></div></div>`}
function task(icon,t,d,act,right='→'){return `<button class="task" onclick="${act}"><span class="taskIcon">${icon}</span><span><b>${t}</b><span class="desc">${d}</span></span><span class="chev">${right}</span></button>`}
function render(){
 document.documentElement.classList.toggle('dark',state.dark);
 const focus=(tab==='learn'||tab==='review'||(tab==='practice'&&mode));
 document.body.classList.toggle('focus',focus);
 const nav=document.getElementById('nav');nav.classList.toggle('hiddenFocus',focus);
 nav.innerHTML=NAV.map(x=>`<button class="navBtn ${tab===x[0]?'on':''}" onclick="go('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('');
 document.getElementById('main').innerHTML=tab==='today'?today():tab==='learn'?learn():tab==='review'?review():tab==='practice'?practice():progress();
 if(mode==='write')setTimeout(initCanvas,0);
}

function goalLabel(g){return g==='work'?'ทำงาน':g==='travel'?'เที่ยวญี่ปุ่น':'ชีวิตประจำวัน'}
function goalIcon(g){return g==='work'?'🏭':g==='travel'?'🧳':'☕'}
function goalMissions(g=state.goal){return MISSIONS.filter(m=>m.goal===g)}
function currentMission(){
  const list=goalMissions();
  const first=list.find(m=>!state.missionDone.includes(m.id));
  return first||list[0];
}
function setGoal(g){state.goal=g;missionId=null;missionResult=null;missionStep=0;missionReading=false;save()}
function startMission(id=null){missionId=id||currentMission()?.id;missionResult=null;missionStep=0;missionReading=false;openPractice('mission')}
function markMissionOption(correct){
  state.skills.mission.total++;
  if(correct){
    state.skills.mission.ok++;
    if(!state.missionDone.includes(missionId))state.missionDone.push(missionId);
    state.xp+=10;
    missionResult='correct';
  }else{
    state.xp+=1;
    missionResult='wrong';
  }
  localStorage.setItem(KEY,JSON.stringify(state));
  render();
}
function nextMission(){
  const list=goalMissions(),i=Math.max(0,list.findIndex(m=>m.id===missionId));
  missionId=list[(i+1)%list.length].id;missionResult=null;missionStep=0;missionReading=false;render();scrollTo({top:0})
}

function missionPrevStep(){
  if(missionStep>0){missionStep--;render();scrollTo({top:0,behavior:'smooth'})}
  else go('today');
}
function missionNextStep(){
  if(missionStep===2 && missionResult!=='correct')return;
  if(missionStep<3){missionStep++;render();scrollTo({top:0,behavior:'smooth'})}
  else nextMission();
}
function toggleMissionReading(){missionReading=!missionReading;render()}

function missionPractice(){
  const m=MISSIONS.find(x=>x.id===missionId)||currentMission();
  if(!m)return '';
  const step=Math.max(0,Math.min(3,missionStep));
  const pct=(step+1)*25;
  const dots=[0,1,2,3].map(i=>`<span class="stepDot ${i===step?'on':''}"></span>`).join('');
  let body='';

  if(step===0){
    body=`<div class="missionStepTitle">STEP 1 • ประโยคที่คุณจะใช้</div>
      <div class="missionCore">
        <div class="jp">${m.jp}</div>
        <div class="th">${m.th}</div>

function writePractice(){
 const p=STROKES[writeIndex%STROKES.length];if(strokeIndex>=p.st.length)strokeIndex=p.st.length-1;const s=p.st[strokeIndex];
 return `<div class="studyShell">${focusHead('เขียน Kanji','ตัวอย่างซ้าย • เขียนตามขวา • เส้นที่เขียนไม่หาย')}<section class="card pad"><div class="between"><button class="btn soft" onclick="prevChar()">‹</button><div style="text-align:center"><div class="title">${p.char} • ${p.th}</div><div class="subtitle">${p.kana} • ${p.st.length} ขีด</div></div><button class="btn soft" onclick="nextChar()">›</button></div><div class="writeDuo"><div><div class="writePaneTitle">ตัวอย่าง</div><div class="strokeBoard">${strokeSvg(p)}</div></div><div><div class="writePaneTitle">เขียนตาม</div><div class="canvasWrap cross"><div class="guideChar">${p.char}</div><canvas id="writeCanvas"></canvas></div></div></div><div class="writeStep"><button class="btn soft" onclick="prevStroke()">‹</button><div class="stepCenter"><b>ขีด ${strokeIndex+1}/${p.st.length} • ${s.n}</b><span>${s.dir} • เส้นเดิมคงอยู่</span></div><button class="btn primary" onclick="nextStroke()">›</button></div><div class="memoryStory">🧠 ${p.memory}</div><div class="studyActions"><button class="btn soft" onclick="clearCanvas()">ล้าง</button><button class="btn good" onclick="nextChar()">ตัวถัดไป →</button></div></section></div>`;
}
function inkKey(){return STROKES[writeIndex%STROKES.length].char}
function initCanvas(){
 const c=document.getElementById('writeCanvas');if(!c)return;const r=c.getBoundingClientRect(),dpr=Math.max(1,devicePixelRatio||1),w=r.width,h=r.height;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=8;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#dc2626';const k=inkKey();if(!writingInk[k])writingInk[k]=[];
 const draw=p=>{if(!p.length)return;ctx.beginPath();ctx.moveTo(p[0].x*w,p[0].y*h);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x*w,p[i].y*h);ctx.stroke();ctx.closePath()};writingInk[k].forEach(draw);
 let d=false,path=null,last=null;const pt=(x,y)=>{const rr=c.getBoundingClientRect(),px=Math.max(0,Math.min(rr.width,x-rr.left)),py=Math.max(0,Math.min(rr.height,y-rr.top));return{px,py,x:px/rr.width,y:py/rr.height}};
 const begin=(x,y)=>{const p=pt(x,y);d=true;path=[{x:p.x,y:p.y}];writingInk[k].push(path);last={x:p.px,y:p.py};ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.px+.01,p.py+.01);ctx.stroke()};
 const move=(x,y)=>{if(!d)return;const p=pt(x,y);if(last&&Math.hypot(p.px-last.x,p.py-last.y)<1.5)return;path.push({x:p.x,y:p.y});ctx.lineTo(p.px,p.py);ctx.stroke();last={x:p.px,y:p.py}};
 const end=()=>{d=false;path=null;last=null;ctx.closePath()};
 c.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];begin(t.clientX,t.clientY)},{passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];move(t.clientX,t.clientY)},{passive:false});c.addEventListener('touchend',e=>{e.preventDefault();end()},{passive:false});
 c.addEventListener('mousedown',e=>begin(e.clientX,e.clientY));window.addEventListener('mousemove',e=>{if(d)move(e.clientX,e.clientY)});window.addEventListener('mouseup',end);
}
function clearCanvas(){writingInk[inkKey()]=[];const c=document.getElementById('writeCanvas');if(c){const x=c.getContext('2d');x.save();x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);x.restore()}}
function nextStroke(){const p=STROKES[writeIndex%STROKES.length];strokeIndex=Math.min(p.st.length-1,strokeIndex+1);render()}
function prevStroke(){strokeIndex=Math.max(0,strokeIndex-1);render()}
function nextChar(){writeIndex=(writeIndex+1)%STROKES.length;strokeIndex=0;render()}
function prevChar(){writeIndex=(writeIndex-1+STROKES.length)%STROKES.length;strokeIndex=0;render()}
function grammarPractice(){
 const g=GRAMMAR[grammarIndex%GRAMMAR.length];
 return `<div class="studyShell">${focusHead('ไวยากรณ์แบบไทย','เข้าใจความหมายก่อน แล้วค่อยจำรูปประโยค')}<section class="card pad"><div class="badge">บท ${grammarIndex+1}/${GRAMMAR.length}</div><div class="title" style="margin-top:8px">${g.t} = ${g.th}</div><div class="grammarBox" style="margin-top:10px"><div class="tiny muted">สูตร</div><div class="formula">${g.f}</div><div style="font-size:20px;font-weight:900">${g.ex}</div><div class="romaji" style="font-size:13px">${g.py}</div><div class="small">${g.et}</div><div class="cue">💡 ${g.tip}</div><button class="btn soft full" style="margin-top:9px" onclick="speak('${g.ex}',.7)">🔊 ฟังประโยค</button></div><div class="studyActions"><button class="btn soft" onclick="grammarIndex=(grammarIndex-1+GRAMMAR.length)%GRAMMAR.length;render()">‹</button><button class="btn good" onclick="state.skills.grammar.total++;state.skills.grammar.ok++;grammarIndex=(grammarIndex+1)%GRAMMAR.length;save()">เข้าใจแล้ว →</button></div></section></div>`;
}
function listenPractice(){
 const w=VOCAB[Math.floor(Math.random()*VOCAB.length)];
 return `<div class="studyShell">${focusHead('ฝึกฟังคำศัพท์','ฟังก่อน แล้วค่อยดูคำตอบ')}<section class="card pad"><div class="wordStage"><button class="btn primary" style="min-width:180px" onclick="speak('${w.jp}',.65)">🔊 ฟังคำ</button><div class="meaning" style="margin-top:15px">${w.thai}</div><div class="cue">คำตอบ: <b>${w.jp}</b> • ${w.kana} • ${w.romaji}</div></div><button class="btn good full" onclick="state.skills.vocab.total++;state.skills.vocab.ok++;render()">คำถัดไป →</button></section></div>`;
}
function backupPractice(){return `<div class="studyShell">${focusHead('ข้อมูลของฉัน','เก็บความคืบหน้าไว้กับตัวคุณ')}<section class="card pad"><div class="title">Backup / Restore</div><p class="subtitle">ข้อมูลเรียนเก็บใน Browser เครื่องนี้ ควรสำรองเป็นระยะ</p><div class="studyActions"><button class="btn primary" onclick="backup()">⬇ Backup</button><label class="btn soft" style="cursor:pointer">⬆ Restore<input type="file" accept="application/json" style="display:none" onchange="restoreFile(this.files[0])"></label></div><button class="btn soft full" style="margin-top:9px" onclick="if(confirm('ล้างข้อมูล Hanasu ทั้งหมด?')){localStorage.removeItem(KEY);location.reload()}">ล้างข้อมูล</button></section></div>`}
function backup(){const blob=new Blob([JSON.stringify({schemaVersion:1,product:'hanasu',edition:'V1 FREE',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`hanasu-v1-free-backup-${localDate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreFile(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.state)throw 0;state={...clone(),...x.state};localStorage.setItem(KEY,JSON.stringify(state));alert('Restore สำเร็จ');render()}catch{alert('ไฟล์ Backup ไม่ถูกต้อง')}};r.readAsText(f)}
function progress(){return `<div class="stack"><section class="card pad"><div class="title">พัฒนาการ</div><p class="subtitle">V1 FREE • ดูความคืบหน้าหลักแบบง่าย</p><div class="metrics" style="margin-top:12px"><div class="metric"><b>${learned()}</b><span>คำที่เรียน</span></div><div class="metric"><b>${mastered()}</b><span>จำมั่นคง</span></div><div class="metric"><b>${state.xp}</b><span>XP</span></div></div></section><section class="card pad"><b>ทักษะ</b><div style="margin-top:10px">คุยโต้ตอบ ${pctSkill('mission')}%</div><div class="progress"><i style="width:${pctSkill('mission')}%"></i></div><div style="margin-top:10px">Kana ${pctSkill('kana')}%</div><div class="progress"><i style="width:${pctSkill('kana')}%"></i></div><div style="margin-top:10px">คำศัพท์ ${pctSkill('vocab')}%</div><div class="progress"><i style="width:${pctSkill('vocab')}%"></i></div><div style="margin-top:10px">ไวยากรณ์ ${pctSkill('grammar')}%</div><div class="progress"><i style="width:${pctSkill('grammar')}%"></i></div></section></div>`}
render();
if(location.protocol==='http:'||location.protocol==='https:'){
 const base=document.createElement('script');base.src='../../shared/notify/all-project-notice.js';base.onload=()=>{const p=document.createElement('script');p.src='./project-notice.js';p.onload=()=>{const c=document.createElement('script');c.src='../../shared/notify/measymate-notify-core.js';document.head.appendChild(c)};document.head.appendChild(p)};document.head.appendChild(base);
}
</script>
</body></html>
