<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071020"><title>โหราจารย์ | HORAJARN — Free</title><style>
:root{--bg:#071020;--panel:#111b34;--ink:#f8f3e6;--muted:#bfc4d2;--gold:#e7c46a;--line:rgba(231,196,106,.25);--ok:#8fd6aa;--warn:#f0b879}*{box-sizing:border-box}body{margin:0;background:linear-gradient(rgba(5,8,24,.83),rgba(5,8,24,.94)),url("assets/horajarn-background.webp") center top/cover fixed no-repeat;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Thai",Tahoma,sans-serif;min-height:100vh}.app{max-width:520px;margin:auto;padding:18px 16px 90px}.top{display:flex;gap:10px;align-items:center}.back{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:#101b35;color:var(--gold);font-size:22px}.miniLogo{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 5px 12px rgba(0,0,0,.35))}.title{flex:1}.title small{color:var(--gold);letter-spacing:.8px}.title h1{font-size:23px;margin:2px 0}.hero,.card{border:1px solid var(--line);border-radius:23px;background:linear-gradient(145deg,rgba(26,37,76,.96),rgba(15,24,50,.96));padding:18px;margin-top:15px}.hero p,.card p{color:#e2dfd7;line-height:1.75;font-size:14px}.profile{display:flex;gap:10px;align-items:center;margin-top:14px;padding:12px;background:rgba(255,255,255,.05);border-radius:16px}.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold)}.profile b{display:block}.profile span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.basis{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.pill{padding:6px 9px;border-radius:999px;background:rgba(231,196,106,.1);border:1px solid var(--line);color:#f8e5a7;font-size:11px}.state{display:inline-block;padding:5px 9px;border-radius:99px;font-size:11px;background:rgba(143,214,170,.12);color:var(--ok)}.state.caution{background:rgba(240,184,121,.12);color:var(--warn)}.state.balanced{color:#d9d9e3;background:rgba(255,255,255,.08)}.grid{display:grid;gap:10px}.mini{padding:13px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.04)}.mini b{color:#fff}.mini small{display:block;color:var(--muted);margin-top:5px}.actions{display:flex;gap:9px;margin-top:14px}.actions button{flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:#162343;color:#fff}.actions .gold{background:linear-gradient(#f1d17a,#c99d42);color:#211a0b;font-weight:800}.notice{font-size:11px;color:#9fa8bb;line-height:1.6;margin-top:15px}.error{text-align:center;padding:30px 18px}.error a{color:var(--gold)}
</style></head><body><main class="app" id="app"></main>
<script src="core/astrology-core.js"></script><script src="sources/source-registry.js"></script><script src="knowledge/knowledge-base.js"></script><script src="rules/rules-v1.js"></script><script src="services/interpretation-engine.js"></script><script src="services/service-engine.js"></script><script>
const params=new URLSearchParams(location.search);const type=params.get('type')||'career';const names={career:['💼','การงาน'],finance:['◈','การเงิน'],love:['♥','ความรักและหุ้นส่วน']};
function profileFromParams(){const p={};['name','day','month','year','hour','minute','place'].forEach(k=>{if(params.has(k))p[k]=params.get(k)});if(p.name)return p;try{return JSON.parse(localStorage.getItem('astroProfileV1')||'{}')}catch{return{}}}
function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
function speak(){if(!window.currentReading||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const r=currentReading,u=new SpeechSynthesisUtterance(`${names[type][1]}ของคุณ ${r.facts.profile.name}. ${r.summary}. ${r.recommendation}`);u.lang='th-TH';u.rate=.95;window.speechSynthesis.speak(u)}
function render(){const p=profileFromParams();if(!AstroCore.validProfile(AstroCore.normalizeProfile(p))){app.innerHTML=`<div class="error"><h2>ยังไม่มีข้อมูลวันเกิดที่สมบูรณ์</h2><p>กลับไปสร้างโปรไฟล์ก่อน แล้วเปิดบริการนี้อีกครั้ง</p><a href="index.html">← กลับหน้าหลัก</a></div>`;return}let r;try{r=AstroServiceEngine.analyze(type,p,new Date())}catch(e){app.innerHTML=`<div class="error"><h2>ไม่สามารถคำนวณได้</h2><p>${esc(e.message)}</p><a href="index.html">← กลับหน้าหลัก</a></div>`;return}window.currentReading=r;const [ico,label]=names[type];const st=r.transit.state,stText=st==='support'?'จังหวะหนุน':st==='caution'?'ควรระวัง':'สมดุล';app.innerHTML=`<div class="top"><button class="back" onclick="location.href='index.html'">‹</button><img class="miniLogo" src="assets/horajarn-logo.webp" alt=""><div class="title"><small>โหราจารย์ • HORAJARN FREE V1</small><h1>${ico} ${label}</h1></div></div><section class="hero"><span class="state ${st}">${stText}</span><p>${esc(r.summary)}</p><div class="profile"><div class="avatar">✦</div><div><b>${esc(r.facts.profile.name)}</b><span>${r.facts.profile.d}/${r.facts.profile.m}/${r.facts.profile.yRaw} • ${esc(AstroCore.lunarString(r.facts.lunar))}</span></div></div><div class="basis">${r.publicBasis.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></section><section class="card"><h3>คำแนะนำช่วงนี้</h3><p>${esc(r.recommendation)}</p><div class="grid"><div class="mini"><b>ดาวเสวยอายุ</b><small>${r.transit.main.number} ${r.transit.main.name} • ${r.transit.main.role}</small></div><div class="mini"><b>ดาวแทรก</b><small>${r.transit.sub.number} ${r.transit.sub.name} • ${r.transit.sub.role}</small></div></div><div class="actions"><button class="gold" onclick="speak()">🔊 ฟังคำอธิบาย</button><button onclick="speechSynthesis&&speechSynthesis.cancel()">หยุดเสียง</button></div><div class="notice">คำพยากรณ์สรุปจากหลักโหราศาสตร์ที่เกี่ยวข้องกับเรื่องนี้ และใช้เป็นแนวทางประกอบการตัดสินใจ</div></section>`}
render();
</script></body></html>
