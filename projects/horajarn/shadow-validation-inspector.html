<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HORAJARN V2.24 Shadow Validation</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f2eb;color:#222}
main{max-width:820px;margin:auto;padding:18px}
.card{background:#fff;border-radius:16px;padding:15px;margin:10px 0}
.pass{background:#dff7e7;color:#075d2b;padding:12px;border-radius:12px;font-weight:700}
.fail{background:#ffe2e2;color:#8a1111;padding:12px;border-radius:12px;font-weight:700}
small{opacity:.72}
</style>
</head>
<body>
<main>

<h1>HORAJARN • V2.24 Shadow Validation</h1>

<p id="gate"></p>
<p id="summary"></p>

<div id="readiness"></div>
<div id="cases"></div>

</main>

<script src="v2/knowledge-v1-foundation.js"></script>
<script src="v2/multisource-knowledge-registry-v2.js"></script>
<script src="v2/knowledge-source-registry-v2.js"></script>
<script src="v2/knowledge-planets-batch1-v2.js"></script>
<script src="v2/knowledge-source-registry-v2.1.js"></script>
<script src="v2/knowledge-mega-batch2-v2.js"></script>
<script src="rules/rules-v1.js"></script>
<script src="v2/integrated-prediction-engine-v2.js"></script>
<script src="v2/shadow-validation-v2.js"></script>

<script>
(function(){
  const V=window.HorajarnShadowValidationV224;
  const g=V.validate();
  const r=g.report;

  const gate=document.getElementById('gate');
  gate.className=g.ok?'pass':'fail';
  gate.textContent=
    g.ok
      ? 'FIELD CHECK PASS'
      : 'FIELD CHECK FAIL: '+g.errors.join(', ');

  document.getElementById('summary').innerHTML=
    '<b>SCENARIOS='+r.passed+'/'+r.total+'</b>'+
    ' • PRODUCTION_CUTOVER=NO';

  document.getElementById('readiness').innerHTML=
    '<article class="card">'+
    '<h2>Cutover Readiness</h2>'+
    '<p><b>Career:</b> '+r.readiness.career+'</p>'+
    '<p><b>Finance:</b> '+r.readiness.finance+'</p>'+
    '<p><b>Love:</b> '+r.readiness.love+'</p>'+
    '<p><b>Global Cutover:</b> NO</p>'+
    '<p><b>Production Runtime Cost:</b> ZERO</p>'+
    '</article>';

  document.getElementById('cases').innerHTML=
    r.cases.map(x=>
      '<article class="card">'+
      '<b>'+(x.ok?'✅ ':'❌ ')+x.name+'</b>'+
      (x.error?'<p>'+x.error+'</p>':'')+
      '</article>'
    ).join('');
})();
</script>

</body>
</html>
